name: Assemble verified Windows installer
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      sha256:
        required: true
        type: string
      size:
        required: true
        type: string
      parts:
        required: true
        type: string
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: dmmhm/writely-releases
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      INSTALLER_SHA: ${{ inputs.sha256 }}
      INSTALLER_SIZE: ${{ inputs.size }}
      PART_COUNT: ${{ inputs.parts }}
    steps:
      - name: Download verified parts and assemble the installer
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, re, subprocess, urllib.request
          tag = os.environ['RELEASE_TAG']
          expected = os.environ['INSTALLER_SHA']
          release_id = int(os.environ['RELEASE_ID'])
          size = int(os.environ['INSTALLER_SIZE'])
          count = int(os.environ['PART_COUNT'])
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          assert release_id > 0 and 0 < size < 2 * 1024**3 and 0 < count <= 96
          base = 'https://api.github.com/repos/dmmhm/writely-releases'
          token = os.environ['GH_TOKEN']
          def api(path, method='GET', value=None):
              request = urllib.request.Request(base + path, method=method, data=None if value is None else json.dumps(value).encode(), headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          release = api(f'/releases/{release_id}')
          assert release['draft'] and release['tag_name'] == tag
          assets = api(f'/releases/{release_id}/assets?per_page=100')
          parts = sorted((a for a in assets if a['name'].startswith('upload-part-')), key=lambda a: a['name'])
          assert len(parts) == count
          assert [a['name'] for a in parts] == [f'upload-part-{i:03d}' for i in range(count)]
          assert sum(a['size'] for a in parts) == size
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(request, fp, code, msg, headers, newurl)
                  redirected.remove_header('Authorization')
                  return redirected
          opener = urllib.request.build_opener(SafeRedirect())
          pathlib.Path('parts').mkdir()
          def download(asset):
              path = pathlib.Path('parts') / asset['name']
              request = urllib.request.Request(asset['url'], headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream'})
              written = 0
              with opener.open(request, timeout=120) as response, path.open('wb') as target:
                  while chunk := response.read(4 * 1024 * 1024):
                      written += len(chunk)
                      assert written <= asset['size']
                      target.write(chunk)
              assert written == asset['size']
              with path.open('rb') as source:
                  assert 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest() == asset['digest']
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              list(executor.map(download, parts))
          name = f'Writely_{tag[1:]}_windows-x64-setup.exe'
          output = pathlib.Path(name)
          with output.open('wb') as target:
              for asset in parts:
                  with (pathlib.Path('parts') / asset['name']).open('rb') as source:
                      while chunk := source.read(4 * 1024 * 1024):
                          target.write(chunk)
          with output.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == expected
          assert output.stat().st_size == size
          subprocess.run(['gh', 'release', 'upload', tag, name, '--repo', os.environ['GH_REPO']], check=True)
          assets = api(f'/releases/{release_id}/assets?per_page=100')
          installer = next(a for a in assets if a['name'] == name)
          assert installer['state'] == 'uploaded' and installer['size'] == size and installer['digest'] == 'sha256:' + expected
          support = {'SHA256SUMS', 'WINDOWS_TEST.txt', name + '.sig'}
          assert support.issubset({a['name'] for a in assets if a['state'] == 'uploaded'})
          for asset in parts:
              api('/releases/assets/' + str(asset['id']), 'DELETE')
          remaining = api(f'/releases/{release_id}/assets?per_page=100')
          assert {a['name'] for a in remaining} == support | {name}
          published = api(f'/releases/{release_id}', 'PATCH', {'draft': False, 'prerelease': True})
          assert not published['draft']
          print('Published verified installer:', published['html_url'])
          PY
